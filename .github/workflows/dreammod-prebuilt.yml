name: DreamMod API-only Prebuilt Client Overlay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mods/dreammod-core/**"
      - "scripts/ci/patch_horizon_api_route.py"
      - ".github/workflows/dreammod-prebuilt.yml"

permissions:
  contents: read

concurrency:
  group: dreammod-prebuilt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api-only-client-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out DreamMod
        uses: actions/checkout@v4
      - name: Check out the exact Horizon Nightly source
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: 0b14f8acfd97fa2c750e42795249dcc981178ca4
          path: .ci/horizon
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libudev-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-xkb-dev libxcb-xinput-dev libxcb-cursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
      - name: Cache pinned Horizon workspace build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .ci/horizon -> target
            .ci/horizon/launcher -> target
          shared-key: horizon-nightly-0b14f8
      - name: Verify HNMod engine source matches canonical engine-core
        run: python3 scripts/ci/check_engine_bridge_sync.py
      - name: Add CI-only tests for the official API route and host loader
        run: python3 scripts/ci/patch_horizon_api_route.py
      - name: Build the API-only prebuilt client overlay using Horizon's signed SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/horizon-xdg/config" "$RUNNER_TEMP/horizon-xdg/data" "$RUNNER_TEMP/horizon-xdg/cache" "$RUNNER_TEMP/dreammod-prebuilt"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/horizon-xdg/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/horizon-xdg/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/horizon-xdg/cache"
          cd .ci/horizon/launcher
          DREAMMOD_MOD_DIR="$GITHUB_WORKSPACE/mods/dreammod-core" \
          DREAMMOD_PREBUILT_DIR="$RUNNER_TEMP/dreammod-prebuilt" \
          DREAMMOD_HORIZON_BUILD="0b14f8acfd97fa2c750e42795249dcc981178ca4" \
          cargo test -p horizon-launcher --lib native_mods::dreammod_api_route_ci::build_prebuilt_api_only_client_overlay -- --ignored --exact --nocapture
      - name: Verify the real Horizon native host loads the prebuilt library
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/horizon
          DREAMMOD_PREBUILT_DIR="$RUNNER_TEMP/dreammod-prebuilt" \
          cargo test -p horizon-mod-host --no-default-features native_libraries::dreammod_ci_loader_test::loads_dreammod_prebuilt_overlay -- --ignored --exact --nocapture
      - name: Inspect and archive the client overlay
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dreammod-prebuilt"
          test -f "$out/horizon-client"
          test -f "$out/native-mods.json"
          grep -q 'dreammod_core' "$out/native-mods.json"
          grep -q '0b14f8acfd97fa2c750e42795249dcc981178ca4' "$out/native-mods.json"
          test -n "$(find "$out" -maxdepth 1 -type f -name '*.so' -print -quit)"
          mkdir -p dist
          cat > dist/overlay.json <<'EOF'
          {
            "target": "client",
            "horizon_commit": "0b14f8acfd97fa2c750e42795249dcc981178ca4",
            "horizon_nightly": "2026-11-18",
            "rust_toolchain": "1.99.1",
            "mod_id": "dreammod_core",
            "format": "Horizon native-mods.json + adjacent libraries",
            "contains_mojang_assets": false
          }
          EOF
          tar -czf dist/dreammod-horizon-nightly-client-overlay.tar.gz -C "$out" .
          cp "$out/native-mods.json" dist/native-mods.json
      - name: Upload verified client overlay
        uses: actions/upload-artifact@v4
        with:
          name: dreammod-horizon-nightly-client-overlay
          path: dist/
          if-no-files-found: error
          retention-days: 14
