name: DreamMod package contract

on:
  push:
    branches: [main]
    paths:
      - "mods/dreammod-package/**"
      - ".github/workflows/dreammod-package.yml"
  pull_request:
    paths:
      - "mods/dreammod-package/**"
      - ".github/workflows/dreammod-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: mods/dreammod-package
        run: cargo fmt --all -- --check
      - name: Run manifest contract tests
        working-directory: mods/dreammod-package
        run: cargo test --all-targets
      - name: Run Clippy
        working-directory: mods/dreammod-package
        run: cargo clippy --all-targets --locked -- -D warnings
