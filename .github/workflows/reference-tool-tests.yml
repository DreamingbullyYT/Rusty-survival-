name: Reference Tool Tests

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/reference-tool-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/reference-tool-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-tool-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Offline downloader tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline tests (no Mojang downloads)
        run: python -m unittest discover -s tools/tests -v
