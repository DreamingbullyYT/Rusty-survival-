name: Private Vanilla 26.3 Parity

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which parity suite to run"
        required: true
        type: choice
        options: [smoke, all, named]
        default: smoke
      harnesses:
        description: "Comma-separated tools/parity.py harness names (only with suite=named)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: private-vanilla-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    name: Download, verify and run Java 26.3 oracles
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "2"
      PARITY_LOCAL_JOBS: "2"
      RUST_BACKTRACE: "0"
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Java matches research lock
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          expected = json.loads(Path("research-lock.json").read_text())["minecraft"]["java_major"]
          result = subprocess.run(["java", "-version"], capture_output=True, text=True, check=True)
          match = re.search(r'version "(\d+)', result.stderr + result.stdout)
          if not match or int(match.group(1)) != expected:
              raise SystemExit(f"JDK mismatch: research-lock.json requires {expected}")
          print(f"JDK {expected} verified")
          PY

      - name: Test the ephemeral downloader
        run: python3 -m unittest discover -s tools/ci -p 'test_vanilla_data.py' -v

      - name: Download and verify official Mojang inputs
        shell: bash
        run: |
          set -euo pipefail
          game_dir="$RUNNER_TEMP/minecraft-vanilla"
          python3 tools/ci/vanilla_data.py --game-dir "$game_dir" --workers 12
          version="$(python3 -c 'import json; print(json.load(open("research-lock.json"))["minecraft"]["version"])')"
          echo "MINECRAFT_DIR=$game_dir" >> "$GITHUB_ENV"
          echo "SERVER_JAR=$game_dir/versions/$version/$version-server.jar" >> "$GITHUB_ENV"

      - name: Import and prepare pinned vanilla resources
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p horizon-prepare -- \
            --root "$GITHUB_WORKSPACE" --prepare \
            --server-jar "$SERVER_JAR" --minecraft-dir "$MINECRAFT_DIR"
          cargo run --locked --release -p horizon-prepare -- \
            sounds --root "$GITHUB_WORKSPACE" --minecraft-dir "$MINECRAFT_DIR"
          cargo run --locked --release -p horizon-prepare -- \
            languages --root "$GITHUB_WORKSPACE" --minecraft-dir "$MINECRAFT_DIR"

      - name: Run selected vanilla parity harnesses
        shell: bash
        env:
          PARITY_SUITE: ${{ inputs.suite }}
          PARITY_HARNESSES: ${{ inputs.harnesses }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          suite = os.environ["PARITY_SUITE"]
          args = ["--fresh", "--jobs", "2"]
          if suite == "smoke":
              args += ["noise", "geometry", "terrain", "chunk_generation"]
          elif suite == "all":
              args += ["--all"]
          elif suite == "named":
              names = [part.strip() for part in os.environ.get("PARITY_HARNESSES", "").replace(",", " ").split()]
              if not names or any(not re.fullmatch(r"[A-Za-z0-9_#-]+", name) for name in names):
                  raise SystemExit("suite=named requires valid comma-separated harness names")
              args += names
          else:
              raise SystemExit("Unknown parity suite")

          log_path = Path(os.environ["RUNNER_TEMP"]) / "parity-private.log"
          with log_path.open("w", encoding="utf-8") as log:
              result = subprocess.run([sys.executable, "tools/parity.py", *args],
                                      stdout=log, stderr=subprocess.STDOUT, check=False)
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          summaries = [line for line in lines if re.match(r"^\d+ passed, \d+ failed in ", line)]
          retries = [line for line in lines if line.startswith("RETRIED ")]
          failures = [match.group(1) for line in lines
                      if (match := re.match(r"^\s{2}([A-Za-z0-9_#-]+):", line))]

          report = [f"Parity runner exit code: {result.returncode}"]
          report.extend(summaries[-1:])
          if retries:
              report.append(f"Harnesses retried: {len(retries)}")
          if failures:
              report.append("Failed harnesses: " + ", ".join(dict.fromkeys(failures)))
          if not summaries:
              report.append("No completed harness summary was produced; detailed output was suppressed.")
          print("\n".join(report))
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as summary:
                  summary.write("## Private Vanilla 26.3 Parity\n\n")
                  summary.write("\n".join(f"- {line}" for line in report) + "\n")
          raise SystemExit(result.returncode)
          PY

      - name: Remove all downloaded Mojang and generated local data
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/minecraft-vanilla" "$RUNNER_TEMP/parity-private.log"
          rm -rf "$GITHUB_WORKSPACE/.local"
