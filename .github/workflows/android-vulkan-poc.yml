name: Android Vulkan POC

on:
  push:
    branches: [main]
    paths:
      - "poc/android-vulkan/**"
      - ".github/workflows/android-vulkan-poc.yml"
      - "docs/project-memory/**"
  pull_request:
    branches: [main]
    paths:
      - "poc/android-vulkan/**"
      - ".github/workflows/android-vulkan-poc.yml"
      - "docs/project-memory/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-vulkan-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 Android Vulkan POC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK and SDK packages
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library
        working-directory: poc/android-vulkan
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a -o app/src/main/jniLibs build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Package debug APK
        working-directory: poc/android-vulkan
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rusty-android-vulkan-poc
          path: poc/android-vulkan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
