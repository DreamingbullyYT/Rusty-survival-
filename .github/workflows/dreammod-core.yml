name: DreamMod Core

on:
  push:
    branches: [main]
    paths:
      - "mods/dreammod-core/**"
      - ".github/workflows/dreammod-core.yml"
  pull_request:
    paths:
      - "mods/dreammod-core/**"
      - ".github/workflows/dreammod-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreammod-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package-native-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out DreamMod
        uses: actions/checkout@v4
      - name: Check out pinned Horizon tooling
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: 0b14f8acfd97fa2c750e42795249dcc981178ca4
          path: .ci/horizon
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache pinned Horizon tooling build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".ci/horizon -> target"
          shared-key: horizon-nightly-0b14f8
      - name: Install WASM target for Horizon's native mod checker
        run: rustup target add wasm32-unknown-unknown
      - name: Build cargo-horizon-mod from the pinned Horizon source
        run: cargo build --manifest-path .ci/horizon/Cargo.toml -p cargo-horizon-mod --release --locked
      - name: Check native mod manifest, source, API use and host/WASM compilation
        working-directory: mods/dreammod-core
        run: '"$GITHUB_WORKSPACE/.ci/horizon/target/release/cargo-horizon-mod" horizon-mod check'
      - name: Check Core formatting
        working-directory: mods/dreammod-core
        run: cargo fmt --all -- --check
      - name: Run Core unit tests against the verified pinned SDK
        working-directory: mods/dreammod-core
        run: cargo test
      - name: Package the native Core source bundle
        working-directory: mods/dreammod-core
        run: '"$GITHUB_WORKSPACE/.ci/horizon/target/release/cargo-horizon-mod" horizon-mod build'
      - name: Upload validated native source bundle
        uses: actions/upload-artifact@v4
        with:
          name: dreammod-core-source-hmod
          path: mods/dreammod-core/target/horizon-mod/dreammod_core.hmod
          if-no-files-found: error
          retention-days: 7
