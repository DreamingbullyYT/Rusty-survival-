[package]
name = "rusty-android-vulkan-poc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "main"
crate-type = ["cdylib"]

[dependencies]
log = "0.4"
pollster = "0.4"
wgpu = "=25.0.0"
winit = { version = "=0.30.13", default-features = false, features = ["android-native-activity", "rwh_06"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
