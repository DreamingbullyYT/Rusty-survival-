[package]
name = "dreammod-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "Interpreted .dmod package loader and runtime for DreamMod"

[dependencies]
rhai = { version = "=1.27.0", default-features = true, features = ["sync", "no_optimize", "serde"] }
semver = { version = "=1.0.27", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.23.0"

[workspace]
